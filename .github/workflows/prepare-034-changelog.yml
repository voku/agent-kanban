name: Prepare 0.3.4 changelog

on:
  push:
    branches:
      - 'release/0.3.4'

permissions:
  contents: write

jobs:
  prepare:
    if: "${{ github.event.head_commit.message == 'chore: run 0.3.4 changelog preparer' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Add 0.3.4 release section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          data = path.read_text()
          needle = '## Unreleased\n'
          replacement = '''## Unreleased\n\n## 0.3.4 - 2026-09-01\n\n### Fixed\n\n- Repair the multi-board configuration static contract introduced in 0.3.3: keep untrusted optional `id`/`title` inputs correctly typed until runtime validation, expose the already-enforced non-empty board set to PHPStan, and remove the resulting dead null guard. Runtime behavior is unchanged.\n\n### Validation\n\n- Exact-head PHP 8.3, 8.4 and 8.5 CI passes, including PHPUnit, PHPStan, coding style, Composer validation and the clean installed consumer.\n'''
          if data.count(needle) != 1:
              raise SystemExit(f'expected exactly one Unreleased header, found {data.count(needle)}')
          path.write_text(data.replace(needle, replacement, 1))
          PY
          git diff --check -- CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'release: prepare 0.3.4'
          git push origin "HEAD:${GITHUB_REF_NAME}"
